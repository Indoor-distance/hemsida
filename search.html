<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Sök - Indoor Distance</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(to right, #0D1B2A, #1B263B);
  color: white;
}

/* NAVBAR */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 30px;
  background: rgba(0,0,0,0.2);
}

.navbar a {
  color: white;
  margin: 0 10px;
  text-decoration: none;
}

/* SÖK */
.search-box input {
  padding: 8px 15px;
  border-radius: 20px;
  border: none;
  outline: none;
}

/* CONTENT */
.container {
  max-width: 800px;
  margin: 60px auto;
  text-align: center;
}

h1 {
  margin-bottom: 30px;
}

/* RESULTAT */
.result-card {
  background: rgba(255,255,255,0.05);
  padding: 20px;
  margin: 15px;
  border-radius: 15px;
  text-align: left;
  transition: 0.2s;
  backdrop-filter: blur(10px);
}

.result-card:hover {
  transform: scale(1.02);
}

.result-card a {
  color: #4dabf7;
  font-size: 18px;
  font-weight: bold;
  text-decoration: none;
}

.result-card p {
  color: #ccc;
}
</style>

</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div><strong>Indoor Distance</strong></div>

  <div>
    <a href="index.html">Hem</a>
    <a href="priser.html">Priser</a>
    <a href="konto.html">Konto</a>
  </div>

  <form action="search.html" method="GET" class="search-box">
    <input type="text" name="q" placeholder="Sök..." required>
  </form>
</div>

<!-- CONTENT -->
<div class="container">
  <h1>Sökresultat</h1>
  <div id="results"></div>
</div>

<script>
const pages = [
  {
    name: "Hem",
    url: "index.html",
    desc: "Tillbaka till startsidan",
    keywords: "start indoor distance hem"
  },
  {
    name: "Priser & Butik",
    url: "priser.html",
    desc: "Se priser och produkter",
    keywords: "pris butik tröja mugg premium"
  },
  {
    name: "Kontakta oss",
    url: "kontakt.html",
    desc: "Kontakta oss för hjälp",
    keywords: "kontakt mail hjälp support"
  },
  {
    name: "Mitt konto",
    url: "konto.html",
    desc: "Hantera ditt konto",
    keywords: "konto login profil användare"
  }
];

const params = new URLSearchParams(window.location.search);
const query = params.get("q")?.toLowerCase() || "";

const resultsDiv = document.getElementById("results");

let found = false;

pages.forEach(page => {
  if (
    page.name.toLowerCase().includes(query) ||
    page.keywords.includes(query)
  ) {
    found = true;

    const div = document.createElement("div");
    div.className = "result-card";

    div.innerHTML = `
      <a href="${page.url}">${page.name}</a>
      <p>${page.desc}</p>
    `;

    resultsDiv.appendChild(div);
  }
});

if (!found) {
  resultsDiv.innerHTML = "<p>Inga resultat hittades 😢</p>";
}
</script>

</body>
</html>
