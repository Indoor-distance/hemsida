<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Sök - Indoor Distance</title>
</head>
<body>

<h1>Sökresultat</h1>

<div id="results"></div>

<script>
const pages = [
  { name: "Hem", url: "index.html", keywords: "start indoor distance" },
  { name: "Priser", url: "priser.html", keywords: "pris premium kostnad" },
  { name: "Kontakt", url: "kontakt.html", keywords: "kontakt mail hjälp" },
  { name: "Konto", url: "konto.html", keywords: "konto login profil" }
];

const params = new URLSearchParams(window.location.search);
const query = params.get("q").toLowerCase();

const resultsDiv = document.getElementById("results");

pages.forEach(page => {
  if (page.name.toLowerCase().includes(query) || page.keywords.includes(query)) {

    const link = document.createElement("a");
    link.href = page.url;
    link.textContent = page.name;

    const div = document.createElement("div");
    div.style.margin = "10px";
    div.appendChild(link);

    resultsDiv.appendChild(div);
  }
});
</script>

</body>
</html>
