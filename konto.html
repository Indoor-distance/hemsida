<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Mitt konto - Indoor Distance</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0D47A1;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 400px;
      margin: 80px auto;
      background: white;
      color: black;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    h1 {
      margin-bottom: 20px;
    }

    .info {
      margin: 15px 0;
      font-size: 16px;
    }

    .status {
      font-weight: bold;
      color: green;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      background: #0D47A1;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #08306b;
    }

    .logout {
      background: red;
    }

    .logout:hover {
      background: darkred;
    }

    .upgrade {
      background: orange;
    }

    .upgrade:hover {
      background: darkorange;
    }
  </style>
</head>

<body>

  <h1>Indoor Distance</h1>

  <div class="container">

    <h2>Mitt konto</h2>

    <div class="info">
      Email: <span id="userEmail">-</span>
    </div>

    <div class="info">
      ID: <span id="userUID">-</span>
    </div>

    <div class="info">
      Status: <span id="premiumStatus" class="status">Gratis</span>
    </div>

    <button class="upgrade">Uppgradera till Premium</button>

    <br>

    <button id="logoutLink" class="logout">Logga ut</button>

  </div>

  <script type="module" src="firebase.js"></script>

</body>
</html>
